[package]
name = "checkinbox"
version = "0.2.1"
description = "聚合 AI 编程工具每日签到"
authors = ["Skyblueee"]
edition = "2021"
rust-version = "1.77"
default-run = "CheckinBox"

[lib]
name = "checkinbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 可执行文件名（窗口标题/托盘/安装包同名）
[[bin]]
name = "CheckinBox"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "net",
    "io-util",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "gzip",
    "default-tls",
] }
chrono = { version = "0.4", features = ["serde", "clock"] }
base64 = "0.22"
sha2 = "0.10"
# Electron safeStorage（OSCrypt v10）加解密：Qoder 客户端登录态 auth.v1.dat
aes-gcm = "0.10"
# Trae CN 客户端 storage.json 的 tc 加密（AES-128-CBC）与刷新 token 的 EC P-256 签名
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem", "std"] }
# 读 App Paths 注册表定位客户端 exe（W 版 API，中文路径无编码问题）
winreg = "0.55"
# 读 WorkBuddy（CodeBuddy）的 state.vscdb（SQLite）里的 safeStorage 凭据
rusqlite = { version = "0.31", features = ["bundled"] }
getrandom = "0.2"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
dirs = "6"
open = "5"
# 开机自启（Windows: HKCU\...\Run）和桌面单实例
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# 自动更新：官方 updater + 安装完成后重启
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tempfile = "3"

[features]
# 生产构建必带：启用后 `generate_context!` 才会把 ../dist 的界面嵌入 exe；
# 不带的话 exe 会去连 devUrl（http://localhost:5173）的开发服务器，
# 没开 `npm run dev` 就会显示「localhost 拒绝连接」。
# ⚠️ tauri-cli 2.12+ 不再自动带这个特性（实测 2.12.4），命令要显式写：
#   npx tauri build --no-bundle --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
